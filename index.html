<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEMO INTERNA | Coordinación Municipal de Comités de Defensa - Kanasín</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* ==========================================================================
           1. VARIABLES Y RESET CSS (Identidad Visual Institucional y Partidista)
           ========================================================================== */
        :root {
            --color-guinda: #7B1E34;       /* Pantone institucional movimiento */
            --color-guinda-oscuro: #541121;
            --color-dorado: #B38E5D;
            --color-crema: #F9F6F2;
            --color-texto: #222222;
            --color-gris: #5A626A;
            --color-blanco: #FFFFFF;
            --color-alerta: #FFF3CD;
            --borde-alerta: #FFEEBA;
            --sombra-suave: 0 4px 15px rgba(0, 0, 0, 0.08);
            --transicion: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background-color: var(--color-crema);
            color: var(--color-texto);
            line-height: 1.6;
        }

        h1, h2, h3, h4, .nav-link, .btn {
            font-family: 'Montserrat', sans-serif;
        }

        /* ==========================================================================
           2. CINTILLO LEGAL OBLIGATORIO (Blindaje INE / IEPAC / CEN)
           ========================================================================== */
        .cintillo-legal {
            background-color: #1A1A1A;
            color: #F1F1F1;
            font-size: 0.78rem;
            padding: 8px 5%;
            text-align: center;
            border-bottom: 3px solid var(--color-dorado);
            letter-spacing: 0.3px;
        }

        .cintillo-legal strong {
            color: #FFD166;
        }

        /* ==========================================================================
           3. ENCABEZADO Y NAVEGACIÓN
           ========================================================================== */
        header {
            background-color: var(--color-guinda);
            color: var(--color-blanco);
            padding: 1rem 5%;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--sombra-suave);
        }

        .header-container {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            flex-direction: column;
        }

        .brand-tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--color-dorado);
            font-weight: 700;
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 800;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 1.5rem;
        }

        nav a {
            color: var(--color-blanco);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 600;
            transition: var(--transicion);
            padding-bottom: 4px;
            border-bottom: 2px solid transparent;
        }

        nav a:hover {
            color: var(--color-dorado);
            border-bottom-color: var(--color-dorado);
        }

        /* ==========================================================================
           4. HERO SECTION (Presentación de Aspiración y Proceso Interno)
           ========================================================================== */
        .hero {
            background: linear-gradient(135deg, var(--color-guinda-oscuro) 0%, var(--color-guinda) 100%);
            color: var(--color-blanco);
            padding: 3.5rem 5%;
            text-align: center;
        }

        .hero-badge {
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.15);
            border: 1px solid var(--color-dorado);
            color: #FFE8C2;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .hero h1 {
            font-size: 2.1rem;
            max-width: 900px;
            margin: 0 auto 1rem;
            line-height: 1.25;
        }

        .hero p {
            max-width: 780px;
            margin: 0 auto 1.8rem;
            font-size: 1rem;
            opacity: 0.92;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.8rem 1.6rem;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            transition: var(--transicion);
            text-decoration: none;
        }

        .btn-dorado {
            background-color: var(--color-dorado);
            color: var(--color-blanco);
        }

        .btn-dorado:hover {
            background-color: #9A7748;
            transform: translateY(-2px);
        }

        .btn-outline {
            background-color: transparent;
            border: 2px solid var(--color-blanco);
            color: var(--color-blanco);
        }

        .btn-outline:hover {
            background-color: var(--color-blanco);
            color: var(--color-guinda);
        }

        /* ==========================================================================
           5. CONTENEDORES Y SECCIONES GENERALES
           ========================================================================== */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 3rem 5%;
        }

        .section-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .section-header h2 {
            color: var(--color-guinda);
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
        }

        .section-header p {
            color: var(--color-gris);
            max-width: 720px;
            margin: 0 auto;
        }

        /* ==========================================================================
           6. FILTRO DE MARCO JURÍDICO (3 Niveles + INE + IEPAC + Estatuto MORENA)
           ========================================================================== */
        .filter-tabs {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-bottom: 2rem;
        }

        .tab-btn {
            padding: 0.6rem 1.2rem;
            background-color: var(--color-blanco);
            border: 1px solid #DDD;
            border-radius: 25px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transicion);
            color: var(--color-texto);
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--color-guinda);
            color: var(--color-blanco);
            border-color: var(--color-guinda);
        }

        .legal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .legal-card {
            background-color: var(--color-blanco);
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: var(--sombra-suave);
            border-top: 4px solid var(--color-guinda);
            transition: var(--transicion);
        }

        .legal-card.hidden {
            display: none;
        }

        .legal-card-tag {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 4px;
            background-color: #F2E6E9;
            color: var(--color-guinda);
            margin-bottom: 0.6rem;
        }

        .legal-card h3 {
            font-size: 1.1rem;
            margin-bottom: 0.6rem;
            color: var(--color-texto);
        }

        .legal-card p {
            font-size: 0.9rem;
            color: var(--color-gris);
            margin-bottom: 0.8rem;
        }

        .legal-article {
            background-color: #F8F9FA;
            padding: 0.7rem;
            border-left: 3px solid var(--color-dorado);
            font-size: 0.82rem;
            font-weight: 600;
        }

        /* ==========================================================================
           7. DIAGNÓSTICO TERRITORIAL Y DATOS DE KANASÍN (Simulador Interactivo)
           ========================================================================== */
        .dashboard-box {
            background-color: var(--color-blanco);
            border-radius: 10px;
            padding: 2rem;
            box-shadow: var(--sombra-suave);
        }

        .kpi-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .kpi-card {
            background-color: var(--color-crema);
            padding: 1.2rem;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #E5DFD7;
        }

        .kpi-number {
